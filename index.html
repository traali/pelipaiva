<!DOCTYPE html>
<html lang="fi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Theme bootstrap before first paint — prevents dark-mode FOUC and makes
      // the saved preference authoritative (M-39/V55: it was write-only).
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light') document.documentElement.classList.remove('dark');
        else if (saved === 'dark') document.documentElement.classList.add('dark');
        else if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FamDay" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="FamDay - Perheen pelipäivät, kuskiringit, koulu ja arjen hermokeskus" />
    <title>FamDay · Perheen arjen & pelipäivien hermokeskus</title>
  </head>
  <body class="bg-canvas text-text-primary antialiased min-h-screen selection:bg-pitch selection:text-text-inverse">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
