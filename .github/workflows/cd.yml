name: Pelipäivä CD Edge Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  pages:
    name: Deploy Cloudflare Pages PWA (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build

      - name: Deploy Cloudflare Pages production alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pelipaiva --commit-dirty=true

  worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        env:
          npm_config_legacy_peer_deps: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-worker'
          wranglerVersion: '4.124.0'
          command: deploy
