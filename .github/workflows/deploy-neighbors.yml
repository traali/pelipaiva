name: Deploy neighbor Pages

# Parkkis and weather-stats do not have CLOUDFLARE_API_TOKEN.
# This house does. Publish their production aliases from here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-neighbors.yml

permissions:
  contents: read
  deployments: write

jobs:
  parkkis:
    name: Deploy Parkkis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: traali/Parkkis
          ref: master
          path: Parkkis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Parkkis/web/package-lock.json
      - name: Install and build
        working-directory: Parkkis/web
        run: npm ci && npm run build
      - name: Publish Parkkis
        working-directory: Parkkis/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create parkkis --production-branch=master || true
          npx --yes wrangler@4 pages deploy dist --project-name=parkkis --commit-dirty=true

  weather:
    name: Deploy weather-stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: traali/weather-stats
          ref: main
          path: weather-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weather-stats/package-lock.json
      - name: Install and build
        working-directory: weather-stats
        run: npm ci && npm run build
      - name: Publish weather-stats
        working-directory: weather-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create weather-stats --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=weather-stats --commit-dirty=true

  federation:
    name: Deploy sports-federation index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: traali/sports-federation
          ref: main
          path: sports-federation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish sports-federation
        working-directory: sports-federation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create sports-federation --production-branch=main || true
          npx --yes wrangler@4 pages deploy site --project-name=sports-federation --commit-dirty=true
