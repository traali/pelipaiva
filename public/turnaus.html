<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnaus – fudisturnaus</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;font-size:15px}
main{max-width:640px;margin:0 auto;padding:12px}h1{font-size:1.2rem;margin:.2em 0}h2{font-size:1rem;margin:1.2em 0 .4em;color:#93c5fd}
.card{background:#1e293b;border-radius:12px;padding:10px 12px;margin:8px 0;border:1px solid #334155}
.live{border-color:#22c55e;box-shadow:0 0 0 2px #22c55e55}.badge{display:inline-block;background:#22c55e;color:#052e16;font-weight:700;border-radius:6px;padding:1px 6px;font-size:.75rem}
.t{display:flex;justify-content:space-between;gap:8px;align-items:center}.time{font-weight:700;font-size:1.1rem}.sc{font-weight:800;font-size:1.2rem;white-space:nowrap}
.me{color:#fde047;font-weight:700}.muted{color:#94a3b8;font-size:.85rem}a{color:#93c5fd}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:4px 3px;text-align:center;border-bottom:1px solid #334155}td:nth-child(2),th:nth-child(2){text-align:left}
input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:#e2e8f0;width:100%;margin:4px 0}button{background:#2563eb;border:0;font-weight:700}
.warn{background:#7c2d12;padding:8px;border-radius:8px}
</style></head><body><main>
<form id="f"><input id="u" placeholder="Liitä fudisturnaus.com -linkki" autocomplete="off"><button>Avaa turnaus</button></form>
<div id="out"></div></main>
<script>
const EDGE='https://pelipaiva-edge.sakkoja.workers.dev/api/fudis/';
const qs=new URLSearchParams(location.search);const $=s=>document.querySelector(s);
const fmt=new Intl.DateTimeFormat('fi-FI',{timeZone:'Europe/Helsinki',hour:'2-digit',minute:'2-digit'});
const fmtD=new Intl.DateTimeFormat('fi-FI',{timeZone:'Europe/Helsinki',weekday:'short',day:'numeric',month:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parse(v){v=(v||'').trim();let slug=v,club=null,team=null;try{const u=new URL(v);const m=u.pathname.match(/\/t\/([^/]+)/);if(m)slug=m[1];club=u.searchParams.get('clubId');team=u.searchParams.get('teamId')}catch{}return{slug,club,team}}
let state={slug:qs.get('t'),club:qs.get('clubId'),team:qs.get('teamId')},data=null,src='',err='';
$('#f').onsubmit=e=>{e.preventDefault();const p=parse($('#u').value);if(!p.slug)return;state={slug:p.slug,club:p.club||state.club,team:p.team};sync();load()};
function sync(){const p=new URLSearchParams();p.set('t',state.slug);if(state.club)p.set('clubId',state.club);if(state.team)p.set('teamId',state.team);history.replaceState(null,'','?'+p)}
async function load(){if(!state.slug){render();return}
 try{const r=await fetch(EDGE+encodeURIComponent(state.slug),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();src='live';err=''}
 catch(e){err=String(e.message||e);
  if(!data&&state.slug.includes('de679b3f')){try{data=await (await fetch('fudis-7127.json')).json();src='saved'}catch{}}}
 render()}
function fieldAddr(d,f){const name=(f&&f.name)||'';const stem=name.split(/\s+/)[0].slice(0,6);const m=stem&&(d.info||'').match(new RegExp(stem+'[^()\\n]{0,40}\\(([^)]+)\\)','i'));
 const city=((d.address||'').match(/\d{5}\s+(.+)$/)||[])[1]||'';return m?m[1]+(city?', '+city:''):(d.address||'')}
function groupDone(d,gid){const ms=d.groupStageMatches.filter(m=>m.groupId===gid);return ms.length&&ms.every(m=>m.homeGoals!=null&&m.awayGoals!=null)}
function resolve(d,gid,rank){const g=d.groups.find(x=>x.id===gid);if(!g||!groupDone(d,gid))return null;const r=g.results.find(x=>x.ranking===rank);return r?{id:r.teamId,name:r.teamName}:null}
function render(){const o=$('#out');if(!data){o.innerHTML=state.slug?`<p class="warn">Turnauksen lataus epäonnistui (${esc(err)}). fudisturnaus.com ei salli suoraa hakua.</p>`:'<p class="muted">Esim. https://www.fudisturnaus.com/t/&lt;turnaus&gt;?clubId=20</p>';return}
 const d=data,now=Date.now();
 const club=state.club?+state.club:null;let teams=d.teams||[];const clubTeams=club?teams.filter(t=>t.clubId===club):[];
 let myIds=state.team?[+state.team]:clubTeams.map(t=>t.id);
 const tname=id=>(teams.find(t=>t.id===id)||{}).name;
 const all=[...d.groupStageMatches.map(m=>({...m,h:m.homeTeam,a:m.awayTeam})),...(d.playoffMatches||[]).map(m=>{const t=(m.title||'').match(/^([A-Z])(\d+)-([A-Z])(\d+)/);let h=null,a=null,hl=m.title,al='';
   if(t){h=resolve(d,m.homeTeamOriginId,+t[2]);a=resolve(d,m.awayTeamOriginId,+t[4]);hl=t[1]+t[2];al=t[3]+t[4]}
   return{...m,h:h||{name:hl,id:null},a:a||{name:al||'?',id:null},po:m.title}})].sort((x,y)=>new Date(x.startTime)-new Date(y.startTime));
 // playoffs that may involve my team (unresolved): match by my group letter
 const myGroups=d.groups.filter(g=>g.results.some(r=>myIds.includes(r.teamId)));
 const mine=all.filter(m=>myIds.includes(m.h.id)||myIds.includes(m.a.id)||(m.po&&m.h.id==null&&myGroups.some(g=>m.homeTeamOriginId===g.id||m.awayTeamOriginId===g.id)));
 const card=m=>{const s=new Date(m.startTime).getTime();const live=now>=s&&now<s+30*60000;const done=m.homeGoals!=null;const f=(d.fields||[]).find(x=>x.id===m.fieldId)||m.field;
  const cls=t=>myIds.includes(t.id)?'me':'';
  return`<div class="card ${live?'live':''}"><div class="t"><span class="time">${fmt.format(s)}</span>${live?'<span class="badge">Käynnissä</span>':''}<span class="muted">${esc(m.po?'Sijoitus '+m.po:(m.group&&m.group.name||'').replace(/^(Lohko \w).*/,'$1'))}</span></div>
  <div class="t" style="margin-top:4px"><div><div class="${cls(m.h)}">${esc(m.h.name)}</div><div class="${cls(m.a)}">${esc(m.a.name)}</div></div><div class="sc">${done?m.homeGoals+'–'+m.awayGoals+(m.penalties?' rp':''):'–'}</div></div>
  <div class="muted">📍 ${esc(f&&f.name)} · <a target="_blank" href="https://maps.google.com/?q=${encodeURIComponent(fieldAddr(d,f))}">${esc(fieldAddr(d,f))}</a></div></div>`};
 const pick=teams.length?`<select id="tp"><option value="">${club?'Seuran joukkueet':'Valitse joukkue'}</option>${teams.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<option value="${t.id}" ${+state.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:'';
 const tables=(myGroups.length?myGroups:d.groups).map(g=>`<h2>${esc(g.name)}</h2><table><tr><th>#</th><th>Joukkue</th><th>O</th><th>V</th><th>T</th><th>H</th><th>M</th><th>P</th></tr>${g.results.map(r=>`<tr class="${myIds.includes(r.teamId)?'me':''}"><td>${r.ranking}</td><td>${esc(r.teamName)}</td><td>${r.matches}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.goalsFor}-${r.goalsAgainst}</td><td><b>${r.points}</b></td></tr>`).join('')}</table>`).join('');
 o.innerHTML=`${src==='saved'?'<p class="warn">⚠️ Live-haku ei onnistunut ('+esc(err)+'). Näytetään tallennettu kopio – tulokset eivät päivity.</p>':err?'<p class="warn">Päivitys epäonnistui: '+esc(err)+'</p>':''}
 <h1>${esc(d.name)}</h1><div class="muted">${fmtD.format(new Date(d.startDate))} · ${esc(d.location)} · ${esc(d.address)}</div>
 ${pick}<div class="muted">Ajat Suomen aikaa · päivittyy 30 s välein · <a target="_blank" href="https://www.fudisturnaus.com/t/${esc(state.slug)}${club?'?clubId='+club:''}">fudisturnaus.com</a></div>
 <h2>${myIds.length?'Omat pelit ('+esc(myIds.map(tname).join(', '))+')':'Kaikki pelit'}</h2>${(myIds.length?mine:all).map(card).join('')||'<p class="muted">Ei pelejä</p>'}
 ${tables}${myIds.length?'<h2>Kaikki pelit</h2>'+all.map(card).join(''):''}`;
 const tp=$('#tp');if(tp)tp.onchange=()=>{state.team=tp.value||null;sync();render()}}
if(state.slug){$('#u').value='https://www.fudisturnaus.com/t/'+state.slug+(state.club?'?clubId='+state.club:'')}
load();setInterval(load,30000);setInterval(render,60000);
</script></body></html>
